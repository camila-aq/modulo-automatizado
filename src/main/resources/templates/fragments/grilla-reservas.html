<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="grillaReservas"
         class="seccion-reservas"
         id="seccionReservas">

    <div class="criterios-reserva">

        <div class="criterios-titulo">
            Criterios de búsqueda
        </div>

        <div class="criterios-contenido">

            <div class="criterio-fila">

                <label for="ubicacionReserva">
                    Ubicación
                </label>

                <select id="ubicacionReserva">
                    <option value="">
                        Cargando ubicaciones...
                    </option>
                </select>

            </div>

            <div class="criterio-fila">

                <label for="fechaReserva">
                    Fecha
                </label>

                <input
                        id="fechaReserva"
                        type="date">

                <button
                        id="botonBuscarGrilla"
                        class="boton-buscar-grilla"
                        type="button">
                    Buscar
                </button>

            </div>

        </div>

    </div>

    <div class="contenedor-grilla-reservas">

        <table class="tabla-reservas">

            <thead>
            <tr id="encabezadoGrillaReservas">

                <th class="encabezado-todos">
                    Todos
                </th>

            </tr>
            </thead>

            <tbody id="cuerpoGrillaReservas">
            </tbody>

        </table>

    </div>

    <div class="leyenda-reservas">

        <span class="leyenda-titulo">
            Estado actual del ambiente
        </span>

        <div class="leyenda-items">

            <div class="leyenda-item">
                <span>AMBIENTE LIBRE</span>
                <span class="muestra-estado estado-libre"></span>
            </div>

            <div class="leyenda-item">
                <span>AMBIENTE RESERVADO</span>
                <span class="muestra-estado estado-reservado"></span>
            </div>

            <div class="leyenda-item">
                <span>AMBIENTE OCUPADO</span>
                <span class="muestra-estado estado-ocupado"></span>
            </div>

            <div class="leyenda-item">
                <span>AMBIENTE NO DISPONIBLE</span>
                <span class="muestra-estado estado-no-disponible"></span>
            </div>

        </div>

    </div>

</section>

</body>
</html>
