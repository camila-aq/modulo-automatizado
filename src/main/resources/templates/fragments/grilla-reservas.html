<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>


<!-- =========================
     Criterios de búsqueda
     ========================= -->

<section th:fragment="criteriosReservas"
         class="seccion-reservas">

    <div class="criterios-reserva">

        <div class="criterios-titulo">
            Criterios de búsqueda
        </div>

        <div class="criterios-contenido">

            <div class="criterio-fila">

                <label for="ubicacionReserva">
                    Ubicación
                </label>

                <select id="ubicacionReserva">

                    <option value="">
                        Cargando ubicaciones...
                    </option>

                </select>

            </div>

            <div class="criterio-fila">

                <label for="fechaReserva">
                    Fecha
                </label>

                <input
                        id="fechaReserva"
                        type="date">

                <button
                        id="botonBuscarGrilla"
                        class="boton-buscar-grilla"
                        type="button">

                    Buscar

                </button>

            </div>

        </div>

    </div>

</section>


<!-- =========================
     Grilla de reservas
     ========================= -->

<section th:fragment="grillaReservas"
         class="seccion-grilla-reservas"
         id="seccionReservas">

    <div class="contenedor-grilla-reservas">

        <table class="tabla-reservas tabla-horarios">

            <thead>

            <tr id="encabezadoGrillaReservas">

                <th class="encabezado-todos">
                    Todos
                </th>

            </tr>

            </thead>


            <!-- =========================
                 Vista general
                 ========================= -->

            <tbody id="cuerpoGrillaReservas">
            </tbody>


            <!-- =========================
                 Detalle de un ambiente
                 ========================= -->

            <tbody id="vistaDetalleAmbienteGeneral"
                   hidden>

            <tr class="fila-detalle-embebido">

                <td id="celdaDetalleAmbienteGeneral">

                    <div th:replace="~{fragments/detalle-ambiente-general :: detalleAmbienteGeneral}">
                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <div class="leyenda-reservas">

        <span class="leyenda-titulo">
            Estado actual del ambiente
        </span>

        <div class="leyenda-items">

            <div class="leyenda-item">

                <span>
                    AMBIENTE LIBRE
                </span>

                <span class="muestra-estado estado-libre">
                </span>

            </div>

            <div class="leyenda-item">

                <span>
                    AMBIENTE RESERVADO
                </span>

                <span class="muestra-estado estado-reservado">
                </span>

            </div>

            <div class="leyenda-item">

                <span>
                    AMBIENTE OCUPADO
                </span>

                <span class="muestra-estado estado-ocupado">
                </span>

            </div>

            <div class="leyenda-item">

                <span>
                    AMBIENTE NO DISPONIBLE
                </span>

                <span class="muestra-estado estado-no-disponible">
                </span>

            </div>

        </div>

    </div>

</section>

</body>
</html>
